[pytest]
# DocuTrace backend test configuration.
#
# Run from the `backend/` directory:
#     pytest                     # everything
#     pytest tests/test_algorithms
#     pytest tests/test_api_integration.py -k comparison
#
# The suite is fully self-contained: `tests/conftest.py` redirects DATABASE_URL
# and the storage roots at a throwaway temp directory before the application's
# settings object is first constructed, so no test ever touches `docutrace.db`
# or `backend/storage/`.
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
asyncio_mode = strict
markers =
    slow: tests that take more than a couple of seconds
