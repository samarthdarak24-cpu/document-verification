# Alembic configuration for the DocuTrace backend.
#
# Run from the ``backend/`` directory:
#
#     alembic upgrade head            # apply migrations
#     alembic revision --autogenerate -m "..."   # generate a new revision
#
# The database URL is NOT read from this file: ``alembic/env.py`` reads the
# ``DATABASE_URL`` environment variable (falling back to the application
# default), so the same checkout can migrate the dev database, a CI database or
# a throw-away test database without editing version-controlled files.

[alembic]
# Path to the migration environment (relative to this file's directory).
script_location = alembic

# Make ``backend/`` importable so ``app.*`` imports resolve in env.py.
prepend_sys_path = .

# Template used to generate migration file names: YYYYMMDD_HHMM_<rev>_<slug>.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators when trimming revision file names.
version_path_separator = os

# Left empty on purpose — env.py injects the URL from the environment.
sqlalchemy.url =


# --------------------------------------------------------------------------- #
# Logging
# --------------------------------------------------------------------------- #
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
